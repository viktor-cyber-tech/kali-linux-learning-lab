<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">PowerShell checksum verification</title><desc id="desc">Illustrated PowerShell terminal comparing a Kali archive SHA256 with the official checksum.</desc>
  <rect width="1440" height="900" fill="#0b1220"/><rect x="90" y="90" width="1260" height="700" rx="18" fill="#0c1020" stroke="#334155" stroke-width="3"/><rect x="90" y="90" width="1260" height="66" rx="18" fill="#1e293b"/><text x="140" y="132" font-family="Segoe UI,Arial" font-size="24" fill="white">Windows PowerShell</text><circle cx="1260" cy="123" r="10" fill="#64748b"/><circle cx="1300" cy="123" r="10" fill="#ef4444"/>
  <text x="140" y="235" font-family="Consolas,monospace" font-size="24" fill="#60a5fa">PS C:\Users\Viktor\Downloads&gt;</text><text x="140" y="282" font-family="Consolas,monospace" font-size="24" fill="#e2e8f0">Get-FileHash .\kali-linux-*-virtualbox-amd64.7z -Algorithm SHA256</text>
  <text x="140" y="370" font-family="Consolas,monospace" font-size="22" fill="#94a3b8">Algorithm</text><text x="340" y="370" font-family="Consolas,monospace" font-size="22" fill="#94a3b8">Hash</text><text x="1110" y="370" font-family="Consolas,monospace" font-size="22" fill="#94a3b8">Path</text>
  <line x1="140" y1="392" x2="1280" y2="392" stroke="#475569" stroke-width="2"/><text x="140" y="445" font-family="Consolas,monospace" font-size="22" fill="#e2e8f0">SHA256</text><text x="340" y="445" font-family="Consolas,monospace" font-size="22" fill="#86efac">41ED7EC51CDD3A5C...</text><text x="1110" y="445" font-family="Consolas,monospace" font-size="22" fill="#e2e8f0">C:\Users\...</text>
  <rect x="140" y="520" width="1140" height="120" rx="14" fill="#052e16" stroke="#22c55e" stroke-width="3"/><text x="180" y="570" font-family="Segoe UI,Arial" font-size="26" font-weight="700" fill="#86efac">✓ Compare all 64 characters</text><text x="180" y="612" font-family="Segoe UI,Arial" font-size="22" fill="#bbf7d0">The calculated value must exactly match the SHA256 on kali.org.</text>
  <text x="90" y="840" font-family="Segoe UI,Arial" font-size="20" fill="#94a3b8">Illustrative walkthrough • Example hash is intentionally shortened; use the current complete value</text>
</svg>
