<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Review Kali settings and start the VM</title><desc id="desc">Illustrated VirtualBox Manager showing a Kali VM with safe resource and NAT settings.</desc>
  <rect width="1440" height="900" fill="#0b1220"/><rect x="70" y="55" width="1300" height="790" rx="18" fill="#f8fafc"/><rect x="70" y="55" width="1300" height="74" rx="18" fill="#183a61"/><text x="120" y="103" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="white">Oracle VirtualBox Manager</text>
  <rect x="110" y="165" width="400" height="600" rx="14" fill="#eef2f7"/><rect x="130" y="195" width="360" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="170" y="245" font-family="Segoe UI,Arial" font-size="29" font-weight="700" fill="#111827">Kali Linux</text><text x="170" y="285" font-family="Segoe UI,Arial" font-size="21" fill="#16a34a">Powered Off</text>
  <rect x="555" y="165" width="755" height="600" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="225" font-family="Segoe UI,Arial" font-size="32" font-weight="700" fill="#111827">Kali Linux — Settings summary</text>
  <text x="610" y="305" font-family="Segoe UI,Arial" font-size="24" fill="#64748b">Base Memory</text><text x="1080" y="305" font-family="Segoe UI,Arial" font-size="25" font-weight="700" fill="#111827">2048 MB</text><line x1="610" y1="330" x2="1240" y2="330" stroke="#e2e8f0"/>
  <text x="610" y="385" font-family="Segoe UI,Arial" font-size="24" fill="#64748b">Processors</text><text x="1080" y="385" font-family="Segoe UI,Arial" font-size="25" font-weight="700" fill="#111827">2 CPUs</text><line x1="610" y1="410" x2="1240" y2="410" stroke="#e2e8f0"/>
  <text x="610" y="465" font-family="Segoe UI,Arial" font-size="24" fill="#64748b">Graphics</text><text x="1080" y="465" font-family="Segoe UI,Arial" font-size="25" font-weight="700" fill="#111827">VMSVGA / 128 MB</text><line x1="610" y1="490" x2="1240" y2="490" stroke="#e2e8f0"/>
  <text x="610" y="545" font-family="Segoe UI,Arial" font-size="24" fill="#64748b">Network</text><rect x="1050" y="510" width="190" height="55" rx="12" fill="#dcfce7"/><text x="1145" y="546" text-anchor="middle" font-family="Segoe UI,Arial" font-size="25" font-weight="700" fill="#15803d">NAT</text>
  <rect x="1020" y="640" width="220" height="70" rx="14" fill="#16a34a"/><polygon points="1060,661 1060,689 1085,675" fill="white"/><text x="1150" y="684" text-anchor="middle" font-family="Segoe UI,Arial" font-size="26" font-weight="700" fill="white">Start</text>
  <rect x="145" y="610" width="330" height="115" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="170" y="653" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#92400e">First login</text><text x="170" y="692" font-family="Consolas,monospace" font-size="22" fill="#78350f">kali / kali → run passwd</text>
  <text x="70" y="875" font-family="Segoe UI,Arial" font-size="20" fill="#94a3b8">Illustrative walkthrough • Settings can vary with host resources and VirtualBox release</text>
</svg>
