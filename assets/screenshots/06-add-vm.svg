<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Add the Kali vbox file in VirtualBox Manager</title><desc id="desc">Illustrated VirtualBox Manager with Add selected and a vbox file highlighted.</desc>
  <rect width="1440" height="900" fill="#0b1220"/><rect x="70" y="55" width="1300" height="790" rx="18" fill="#f8fafc"/><rect x="70" y="55" width="1300" height="74" rx="18" fill="#183a61"/><text x="120" y="103" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="white">Oracle VirtualBox Manager</text>
  <rect x="70" y="129" width="1300" height="90" fill="#e8edf3"/><rect x="125" y="150" width="135" height="50" rx="10" fill="#fff" stroke="#94a3b8"/><text x="192" y="184" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" fill="#334155">New</text><rect x="285" y="150" width="135" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="352" y="184" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#1d4ed8">Add</text>
  <rect x="110" y="255" width="340" height="520" rx="14" fill="#eef2f7"/><text x="150" y="315" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#111827">Virtual Machines</text><text x="150" y="375" font-family="Segoe UI,Arial" font-size="22" fill="#64748b">No VMs added yet</text>
  <rect x="500" y="255" width="800" height="520" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="545" y="315" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#111827">Select a virtual machine file</text><text x="545" y="360" font-family="Segoe UI,Arial" font-size="21" fill="#64748b">C:\VMs\Kali\kali-linux-current-virtualbox-amd64\</text>
  <rect x="540" y="400" width="720" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="575" y="447" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#1d4ed8">kali-linux-current-virtualbox-amd64.vbox</text>
  <rect x="1030" y="680" width="210" height="58" rx="12" fill="#2563eb"/><text x="1135" y="718" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">Open</text>
  <text x="70" y="875" font-family="Segoe UI,Arial" font-size="20" fill="#94a3b8">Illustrative walkthrough • Use Add / Machine → Add, not Import Appliance</text>
</svg>
