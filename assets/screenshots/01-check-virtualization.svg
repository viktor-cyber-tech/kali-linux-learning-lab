<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Windows Task Manager showing virtualization enabled</title>
  <desc id="desc">Illustrated walkthrough image highlighting Virtualization Enabled on the CPU performance page.</desc>
  <rect width="1440" height="900" fill="#0b1220"/><rect x="90" y="70" width="1260" height="760" rx="20" fill="#f7f8fa"/>
  <rect x="90" y="70" width="1260" height="62" rx="20" fill="#e7e9ed"/><circle cx="126" cy="101" r="8" fill="#ef4444"/><circle cx="152" cy="101" r="8" fill="#f59e0b"/><circle cx="178" cy="101" r="8" fill="#22c55e"/>
  <text x="220" y="110" font-family="Segoe UI,Arial" font-size="24" fill="#111827">Task Manager</text>
  <rect x="120" y="160" width="250" height="620" rx="14" fill="#eef1f5"/><text x="155" y="220" font-family="Segoe UI,Arial" font-size="24" fill="#4b5563">Processes</text>
  <rect x="135" y="250" width="220" height="56" rx="10" fill="#dbeafe"/><text x="155" y="286" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#1d4ed8">Performance</text>
  <text x="410" y="210" font-family="Segoe UI,Arial" font-size="40" font-weight="700" fill="#111827">CPU</text><text x="1240" y="210" text-anchor="end" font-family="Segoe UI,Arial" font-size="22" fill="#4b5563">Intel / AMD processor</text>
  <rect x="410" y="250" width="890" height="300" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/><path d="M420 515 L510 500 L590 490 L650 430 L720 470 L790 380 L860 445 L940 420 L1010 455 L1080 350 L1160 410 L1290 390" fill="none" stroke="#2563eb" stroke-width="5"/>
  <text x="430" y="610" font-family="Segoe UI,Arial" font-size="23" fill="#4b5563">Speed</text><text x="430" y="646" font-family="Segoe UI,Arial" font-size="29" fill="#111827">2.30 GHz</text>
  <text x="760" y="610" font-family="Segoe UI,Arial" font-size="23" fill="#4b5563">Cores</text><text x="760" y="646" font-family="Segoe UI,Arial" font-size="29" fill="#111827">8</text>
  <rect x="995" y="586" width="280" height="92" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="1020" y="621" font-family="Segoe UI,Arial" font-size="21" fill="#166534">Virtualization</text><text x="1020" y="659" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#15803d">Enabled</text>
  <rect x="965" y="700" width="340" height="76" rx="14" fill="#2563eb"/><text x="1135" y="747" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="white">Confirm before installing</text>
  <text x="90" y="870" font-family="Segoe UI,Arial" font-size="20" fill="#94a3b8">Illustrative walkthrough • UI may vary by Windows version</text>
</svg>
